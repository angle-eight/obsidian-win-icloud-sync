name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ObsidianWinSync.sln
      - run: dotnet build ObsidianWinSync.sln --no-restore --configuration Release
      - run: dotnet test ObsidianWinSync.sln --no-build --configuration Release
